use_directory_urls: false
extra_css:
  - css/jmpstyle.css
extra_javascript:
  - js/syntaxhighlighting.js
  - js/popper.min.js
  - js/tippy.js
  - js/extra.js
  - js/clipboard.js
plugins:
  - search:
      prebuild_index: true