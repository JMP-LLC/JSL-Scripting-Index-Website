site_name: JMP Scripting Index
theme: 
  name: readthedocs
  custom_dir: custom_theme
  highlightjs: true
  locale: en
  hljs_languages:
    - python
  logo: img/JMPScriptingIndexLogoUpdated.svg
  collapse_navigation: false
  navigation_depth: 6
  include_homepage_in_sidebar: false
site_url: https://jsl.jmp.com
site_description: The JMP Scripting Index provides a brief description and the syntax for JMP Scripting Language functions, objects, python integration, and display boxes for the JMP® Software.
copyright: © 2025 JMP Statistical Discovery LLC. All Rights Reserved.
use_directory_urls: false
extra_css:
  - css/jmpstyle.css
extra_javascript:
  - js/syntaxhighlighting.js
  - js/popper.min.js
  - js/tippy.js
  - js/extra.js
  - js/clipboard.js
plugins:
  - search:
      prebuild_index: true
