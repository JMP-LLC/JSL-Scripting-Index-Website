site_name: JMP SkriptIndex
theme: 
  name: readthedocs
  custom_dir: custom_theme
  highlightjs: false
  locale: de
  logo: img/JMPScriptingIndexLogo.svg
  collapse_navigation: false
  navigation_depth: 6
  include_homepage_in_sidebar: false
site_url: https://jsl.jmp.com/de
site_description: The JMP Scripting Index provides a brief description and the syntax for JSL functions, objects, python integration, and display boxes for the JMP® Software.
copyright: © 2026 JMP Statistical Discovery LLC. Alle Rechte vorbehalten.
use_directory_urls: false
extra_css:
  - css/jmpstyle.css
  - css/prism.css
extra_javascript:
  - js/prism.min.js
  - js/prism-custom.js
  - js/popper.min.js
  - js/tippy.js
  - js/extra.js
  - js/clipboard.js
plugins:
  - search:
      # prebuild_index: true
      indexing: sections
  - exclude-search:
      exclude:
          - "**/Functions/Alle*.md" 
  


