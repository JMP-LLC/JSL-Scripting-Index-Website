site_name: JMP 脚本索引
theme: 
  name: readthedocs
  custom_dir: custom_theme
  highlightjs: true
  locale: zh_CN
  hljs_languages:
    - python
  logo: img/JMPScriptingIndexLogo.svg
  collapse_navigation: false
  navigation_depth: 6
  include_homepage_in_sidebar: false
site_url: https://jsl.jmp.com/zh-cn
site_description: The JMP Scripting Index provides a brief description and the syntax for JSL functions, objects, python integration, and display boxes for the JMP® Software.
copyright: © 2025 JMP Statistical Discovery LLC. 保留所有权利。
use_directory_urls: false
extra_css:
  - css/jmpstyle.css
extra_javascript:
  - js/syntaxhighlighting.js
  - js/popper.min.js
  - js/tippy.js
  - js/extra.js
  - js/clipboard.js
plugins:
  - search:
      prebuild_index: true
      separator: '[\s\u200b\-]'
      lang: ja